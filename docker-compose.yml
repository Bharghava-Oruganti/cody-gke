services:

  redis:
    image: redis:7-alpine
    container_name: springweb-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: springweb-backend

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: ${MONGODB_URI}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./files:/app/files

    depends_on:
      - redis

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  frontend:
    build:
      context: ./UI-Coder
      dockerfile: Dockerfile

    container_name: springweb-frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped


volumes:
  redis-data: