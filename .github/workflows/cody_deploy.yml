name: CICD Deploy

on:
  push:
    branches:
      - main
      - frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: backend

      - name: Checkout frontend (frontend)
        if: github.ref == 'refs/heads/frontend'
        uses: actions/checkout@v4
        with:
          ref: frontend
          path: frontend

      - name: Prepare deployment package
        run: |
          mkdir -p cody/backend
          mkdir -p cody/frontend

          if [ -d backend ]; then
            cp -r backend/src cody/backend/src
            cp backend/pom.xml cody/backend/
            cp backend/Dockerfile cody/backend/
            cp backend/docker-compose.yml cody/
          fi

          if [ -d frontend ]; then
            cp -r frontend/src cody/frontend/src
            cp -r frontend/public cody/frontend/public
            cp frontend/Dockerfile cody/frontend/
            cp frontend/index.html cody/frontend/
            cp frontend/install-theme.sh cody/frontend/
            cp frontend/package.json cody/frontend/
            cp frontend/package-lock.json cody/frontend/
            cp frontend/vite.config.js cody/frontend/
          fi

          tar -czf deploy_package.tar.gz -C cody .

      - name: Copy tar to VM via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy_package.tar.gz"
          target: "/home/${{ secrets.VM_USER }}/"

      - name: Extract and deploy on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}

            # Stop running containers if compose file exists
            if [ -f cody/docker-compose.yml ]; then
              docker compose -f cody/docker-compose.yml down --volumes
            fi

            # Extract the deployment package
            mkdir -p tmp
            tar -xzf deploy_package.tar.gz -C tmp

            # Backup existing backend/frontend folders if they exist
            mkdir -p backup
            if [ -d cody/backend ]; then
              mv cody/backend backup/backend_$(date +%s)
            fi
            if [ -d cody/frontend ]; then
              mv cody/frontend backup/frontend_$(date +%s)
            fi

            # Move new folders into cody/
            if [ -d tmp/backend ]; then
              mv tmp/backend cody/
            fi
            if [ -d tmp/frontend ]; then
              mv tmp/frontend cody/
            fi
            if [ -f tmp/docker-compose.yml ]; then
              mv tmp/docker-compose.yml cody/
            fi

            # Clean up
            rm -rf tmp
            rm -f deploy_package.tar.gz

            # Rebuild and start containers
            docker compose -f cody/docker-compose.yml up -d --build
